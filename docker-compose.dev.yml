version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: taskmanagement-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --loglevel verbose
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: taskmanagement-redis-ui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_dev_data: